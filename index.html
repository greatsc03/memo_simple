<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="메모">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<title>나의 메모</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6f5e'/%3E%3Cpath d='M18 20h28M18 32h28M18 44h18' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f4ef; --surface: #ffffff; --text: #1d1f22; --muted: #6b6f76;
  --line: #e3e0d8; --accent: #2f6f5e; --accent-text: #ffffff; --chip: #eeebe3;
  --danger: #c0392b; --focus: #2f6f5e55; --cat: #e4efe9; --cat-text: #24584a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16171a; --surface: #1f2125; --text: #e8e6e1; --muted: #9a9ea6;
    --line: #2e3136; --accent: #5fb39b; --accent-text: #0f1513; --chip: #2a2d32;
    --danger: #ef7d6b; --focus: #5fb39b55; --cat: #23362f; --cat-text: #8fd3bd;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.6 Calibri, "MemoNanum", -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
}
.wrap { max-width: 680px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
header h1 { flex: 1; }
h1 { font-size: 21px; margin: 0; font-weight: 700; }
button, input, textarea { font: inherit; color: inherit; }
button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 7px 12px; cursor: pointer; min-height: 38px;
}
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; }
button.link { border: none; background: none; color: var(--muted); padding: 6px 4px; min-height: 0; }
button.edit { color: var(--accent); font-weight: 700; }
button.del { color: var(--danger); font-weight: 700; }
button.chip { background: var(--chip); border-color: transparent; border-radius: 999px; padding: 4px 12px; min-height: 32px; font-size: 14.5px; }
button.chip.on { background: var(--accent); color: var(--accent-text); }
button:disabled { opacity: .55; cursor: default; }
input, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
input:focus, textarea:focus, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
textarea { min-height: 130px; resize: vertical; line-height: 1.65; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 160px; min-width: 0; }
.stack > * + * { margin-top: 10px; }
.label { font-size: 13px; color: var(--muted); min-width: 52px; }
.muted { color: var(--muted); font-size: 14px; }
.msg { font-size: 14px; min-height: 20px; }
.msg.err { color: var(--danger); }
.hidden { display: none !important; }
#login { max-width: 380px; margin: 12vh auto 0; }
#composer.editing { border-color: var(--accent); box-shadow: 0 0 0 2px var(--focus); }

.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { position: relative; width: 76px; height: 76px; border-radius: 10px; overflow: hidden; background: var(--chip); border: 1px solid var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
.thumb .x { position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; min-height: 0; padding: 0; border-radius: 50%; border: none; background: #000a; color: #fff; font-size: 14px; line-height: 24px; }

.filelist { display: flex; flex-direction: column; gap: 6px; }
.filelist:empty { display: none; }
.memo-body .filelist { margin-top: 8px; }
.file { display: flex; align-items: center; gap: 8px; background: var(--chip); border-radius: 10px; padding: 6px 10px; font-size: 14.5px; }
.file .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .fsize { color: var(--muted); font-size: 13px; flex: none; }
.file button { min-height: 0; padding: 2px 6px; flex: none; }
.file button.get { color: var(--accent); font-weight: 700; }

.tabs { display: flex; gap: 8px; margin-bottom: 14px; }
.tab { flex: 1; border-radius: 12px; font-weight: 700; }
.tab.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.tab .badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--chip); color: var(--text); font-size: 12.5px; line-height: 20px; }
.tab.on .badge { background: #ffffff33; color: inherit; }
.tab .badge.alert { background: var(--danger); color: #fff; }
#todoComposer.editing { border-color: var(--accent); box-shadow: 0 0 0 2px var(--focus); }
.todo { display: flex; align-items: flex-start; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.todo input[type=checkbox] { width: 22px; height: 22px; padding: 0; flex: none; margin-top: 2px; accent-color: var(--accent); cursor: pointer; }
.todo .tbody { flex: 1; min-width: 0; }
.todo .ttitle { word-break: break-word; }
.todo .tmeta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px; font-size: 13.5px; color: var(--muted); }
.todo .due.overdue { color: var(--danger); font-weight: 700; }
.todo .due.today { color: var(--accent); font-weight: 700; }
.todo.is-done .ttitle { text-decoration: line-through; color: var(--muted); }
.todo .tact { display: flex; gap: 2px; flex: none; }
.filters { margin-top: 18px; }
#list { margin-top: 10px; }
.day { border-bottom: 1px solid var(--line); }
.day-head { width: 100%; display: flex; align-items: center; gap: 8px; border: none; background: none; border-radius: 0; padding: 12px 2px; font-weight: 700; text-align: left; }
.day-head .count { color: var(--muted); font-weight: 400; font-size: 14px; }
.caret { display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
.open > .day-head .caret, .memo.open > .memo-head .caret { transform: rotate(90deg); }
.day-body { padding: 0 0 8px 6px; }
.memo { border-radius: 10px; }
.memo + .memo { margin-top: 2px; }
.memo-head { width: 100%; display: flex; align-items: baseline; gap: 8px; border: none; background: none; border-radius: 8px; padding: 8px 6px; text-align: left; min-height: 0; }
.memo-head:hover { background: var(--chip); }
.memo-head .time { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; flex: none; }
.memo-head .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.memo-head .pic { color: var(--muted); font-size: 13px; flex: none; }
.cat { display: inline-block; flex: none; font-size: 12.5px; padding: 1px 8px; border-radius: 999px; background: var(--cat); color: var(--cat-text); font-weight: 700; }
.memo-body { padding: 2px 8px 10px 28px; }
.memo-body .place { color: var(--muted); font-size: 14px; margin-bottom: 4px; }
.memo-body .place a { color: inherit; }
.content { white-space: pre-wrap; word-break: break-word; }
.memo-body .thumbs { margin-top: 8px; }
.actions { margin-top: 6px; display: flex; gap: 10px; }
.empty { text-align: center; color: var(--muted); padding: 28px 0; }

#lightbox { position: fixed; inset: 0; background: #000d; display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; cursor: zoom-out; }
#lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">

  <section id="login" class="card stack hidden">
    <h1>나의 메모</h1>
    <p class="muted">대시보드와 같은 계정으로 로그인하세요.</p>
    <form id="loginForm" class="stack">
      <input id="email" type="email" autocomplete="username" placeholder="이메일" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
      <button class="primary" type="submit" style="width:100%">로그인</button>
      <div id="loginMsg" class="msg err" role="alert"></div>
    </form>
  </section>

  <main id="app" class="hidden">
    <header>
      <h1>나의 메모</h1>
      <button class="link" id="exportBtn" type="button">내보내기</button>
      <button class="link" id="logoutBtn" type="button">로그아웃</button>
    </header>
    <div id="exportMsg" class="msg" role="status"></div>

    <nav class="tabs" role="tablist" aria-label="화면 선택">
      <button type="button" id="tabMemo" class="tab on" role="tab" aria-selected="true">메모</button>
      <button type="button" id="tabTodo" class="tab" role="tab" aria-selected="false">할 일<span id="todoBadge" class="badge hidden"></span></button>
    </nav>

    <div id="memoView">
    <section id="composer" class="card stack" aria-label="메모 작성">
      <div class="row">
        <input id="when" class="grow" type="datetime-local" aria-label="날짜와 시간">
        <button type="button" id="nowBtn">지금</button>
      </div>
      <div class="row">
        <input id="place" class="grow" type="text" maxlength="200" placeholder="장소" aria-label="장소">
        <button type="button" id="gpsBtn">현재 위치</button>
      </div>
      <div class="row"><span class="label">장소</span><span class="row grow" id="placeChips"></span></div>
      <div class="row"><span class="label">카테고리</span><span class="row grow" id="catChips"></span></div>
      <textarea id="content" placeholder="첫 줄은 제목이 됩니다.&#10;지금 떠오른 생각을 적어보세요." aria-label="내용"></textarea>
      <div class="thumbs" id="composerThumbs"></div>
      <div class="filelist" id="composerFiles"></div>
      <div class="row">
        <button type="button" id="photoBtn">📷 사진 추가</button>
        <input id="photoInput" type="file" accept="image/*" multiple class="hidden">
        <button type="button" id="fileBtn">📎 파일 첨부</button>
        <input id="fileInput" type="file" multiple class="hidden">
        <span id="saveMsg" class="msg grow" role="status"></span>
        <button type="button" id="cancelEditBtn" class="hidden">취소</button>
        <button type="button" id="saveBtn" class="primary">저장</button>
      </div>
      <div class="muted">Ctrl+Enter로 저장 · 작성 중인 글은 이 기기에 임시 저장됩니다(사진·파일 제외)</div>
    </section>

    <div class="filters stack">
      <input id="search" type="search" placeholder="내용·장소 검색" aria-label="검색">
      <div class="row" id="filterChips"></div>
    </div>
    <div id="list"></div>
    <div id="listMsg" class="msg" role="status"></div>
    <div class="row" style="justify-content:center"><button type="button" id="moreBtn" class="hidden">더 보기</button></div>
    </div>

    <div id="todoView" class="hidden">
      <section id="todoComposer" class="card stack" aria-label="할 일 추가">
        <input id="todoTitle" type="text" maxlength="500" placeholder="할 일을 입력하고 Enter" aria-label="할 일">
        <div class="row">
          <span class="label">마감일</span>
          <input id="todoDue" class="grow" type="date" aria-label="마감일">
        </div>
        <div class="row">
          <span class="label"></span>
          <button type="button" id="todoDueToday" class="chip">오늘</button>
          <button type="button" id="todoDueTomorrow" class="chip">내일</button>
          <button type="button" id="todoDueClear" class="link">지우기</button>
        </div>
        <div class="row"><span class="label">카테고리</span><span class="row grow" id="todoCatChips"></span></div>
        <div class="row">
          <span id="todoMsg" class="msg grow" role="status"></span>
          <button type="button" id="todoCancelBtn" class="hidden">취소</button>
          <button type="button" id="todoSaveBtn" class="primary">추가</button>
        </div>
      </section>
      <div class="filters"><div class="row" id="todoFilterChips"></div></div>
      <div id="todoList"></div>
      <div id="todoDone"></div>
      <div id="todoListMsg" class="msg" role="status"></div>
    </div>
  </main>
</div>
<div id="lightbox" class="hidden" role="dialog" aria-label="사진 크게 보기"><img alt=""></div>

<script id="core">
(function (g) {
  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];
  function pad(n) { return String(n).padStart(2, '0'); }

  function escapeSearch(q) {
    return String(q).replace(/\\/g, '\\\\').replace(/%/g, '\\%').replace(/_/g, '\\_');
  }
  function quote(v) { return '"' + String(v).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"'; }
  function buildListQuery(opts) {
    opts = opts || {};
    var parts = ['select=*', 'order=noted_at.desc,id.desc', 'limit=' + (opts.limit || 50)];
    if (opts.offset) parts.push('offset=' + opts.offset);
    if (opts.category) parts.push('category=eq.' + encodeURIComponent(opts.category));
    var s = (opts.search || '').trim();
    if (s) {
      var pat = quote('*' + escapeSearch(s) + '*');
      parts.push('or=' + encodeURIComponent('(content.ilike.' + pat + ',place.ilike.' + pat + ')'));
    }
    return parts.join('&');
  }
  function dayLabel(d, now) {
    var t = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DAYS[d.getDay()] + ')';
    return now && d.getFullYear() === now.getFullYear() ? t : d.getFullYear() + '년 ' + t;
  }
  function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function formatWhen(iso, now) { var d = new Date(iso); return dayLabel(d, now || new Date()) + ' ' + hm(d); }
  function dayKey(iso) { var d = new Date(iso); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function toLocalInput(d) { return dayKey(d.toISOString()) + 'T' + hm(d); }
  function fromLocalInput(s) { return new Date(s).toISOString(); }
  function isExpired(session, nowSec) {
    if (!session || !session.expires_at) return true;
    return session.expires_at - 60 <= nowSec;
  }

  function lines(content) { return String(content || '').split(/\r?\n/); }
  function titleOf(content, max) {
    max = max || 40;
    var first = lines(content).map(function (l) { return l.trim(); }).filter(Boolean)[0];
    if (!first) return '(제목 없음)';
    var chars = Array.from(first);
    return chars.length > max ? chars.slice(0, max).join('') + '…' : first;
  }
  function bodyOf(content) {
    var ls = lines(content), i = 0;
    while (i < ls.length && !ls[i].trim()) i++;
    return ls.slice(i + 1).join('\n').replace(/^\s*\n/, '').replace(/^(\s*\n)+/, '').trim();
  }
  function groupByDate(memos, now) {
    var out = [], idx = {};
    memos.forEach(function (m) {
      var k = dayKey(m.noted_at);
      if (!(k in idx)) { idx[k] = out.length; out.push({ key: k, label: dayLabel(new Date(m.noted_at), now || new Date()), items: [] }); }
      out[idx[k]].items.push(m);
    });
    return out;
  }

  function csvCell(v) {
    v = v == null ? '' : String(v);
    return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function toCsv(memos) {
    var rows = [['날짜', '시간', '카테고리', '장소', '제목', '내용', '사진 수', '첨부 파일']];
    memos.forEach(function (m) {
      var d = new Date(m.noted_at);
      rows.push([dayKey(m.noted_at), hm(d), m.category || '', m.place || '', titleOf(m.content, 1000), m.content, (m.photos || []).length,
        (m.files || []).map(function (f) { return f.name; }).join('; ')]);
    });
    return '\uFEFF' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n') + '\r\n';
  }
  function toMarkdown(memos, photoMap, fileMap) {
    photoMap = photoMap || {}; fileMap = fileMap || {};
    var out = ['# 나의 메모', '', '내보낸 시각: ' + formatWhen(new Date().toISOString(), new Date(0)), ''];
    groupByDate(memos, new Date(0)).forEach(function (g) {
      out.push('## ' + g.label, '');
      g.items.forEach(function (m) {
        var head = [hm(new Date(m.noted_at)), m.category, m.place].filter(Boolean).join(' · ');
        out.push('### ' + head + ' — ' + titleOf(m.content, 1000), '');
        var b = bodyOf(m.content);
        if (b) out.push(b, '');
        (m.photos || []).forEach(function (p) { if (photoMap[p]) out.push('![](' + photoMap[p] + ')', ''); });
        var fl = (m.files || []).map(function (f) { return '- 📎 ' + (fileMap[f.path] ? '[' + f.name + '](<' + fileMap[f.path] + '>)' : f.name + ' (내려받지 못함)'); });
        if (fl.length) out.push(fl.join('\n'), '');
      });
    });
    return out.join('\n');
  }

  var CRC_TABLE = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  function crc32(bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  // 압축 없이(store) 묶는 zip. 파일명은 UTF-8(플래그 0x0800).
  function makeZip(files, date) {
    date = date || new Date();
    var dosTime = (date.getHours() << 11) | (date.getMinutes() << 5) | (date.getSeconds() >> 1);
    var dosDate = ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
    var enc = new TextEncoder(), locals = [], centrals = [], offset = 0;
    files.forEach(function (f) {
      var name = enc.encode(f.name), data = f.data, crc = crc32(data);
      var lh = new Uint8Array(30 + name.length), lv = new DataView(lh.buffer);
      lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true); lv.setUint16(8, 0, true);
      lv.setUint16(10, dosTime, true); lv.setUint16(12, dosDate, true); lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true); lv.setUint32(22, data.length, true); lv.setUint16(26, name.length, true); lv.setUint16(28, 0, true);
      lh.set(name, 30);
      var ch = new Uint8Array(46 + name.length), cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true);
      cv.setUint16(12, dosTime, true); cv.setUint16(14, dosDate, true); cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true); cv.setUint16(28, name.length, true);
      cv.setUint32(42, offset, true);
      ch.set(name, 46);
      locals.push(lh, data); centrals.push(ch);
      offset += lh.length + data.length;
    });
    var cdSize = centrals.reduce(function (s, c) { return s + c.length; }, 0);
    var end = new Uint8Array(22), ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
    var parts = locals.concat(centrals, [end]);
    var total = parts.reduce(function (s, p) { return s + p.length; }, 0), out = new Uint8Array(total), pos = 0;
    parts.forEach(function (p) { out.set(p, pos); pos += p.length; });
    return out;
  }

  function photoPath(uid, id) {
    var d = new Date();
    return uid + '/' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + id + '.jpg';
  }
  function randomHex(n) {
    var a = new Uint8Array(n), c = globalThis.crypto;
    if (c && c.getRandomValues) c.getRandomValues(a); else for (var i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256);
    return Array.from(a, function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  function fileKey(uid, name) {
    var d = new Date(), m = /\.([A-Za-z0-9]{1,8})$/.exec(String(name || ''));
    return uid + '/' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + randomHex(8) + (m ? '.' + m[1].toLowerCase() : '');
  }

    var body = { content: content, place: $('place').value.trim() || null, noted_at: noted, category: category };

    var uploaded = [], uploadedFiles = [];

        uploaded.push(await uploadPhoto(newPhotos[i].blob));
      }
      for (var j = 0; j < newFiles.length; j++) {

        var removed = (editing.photos || []).filter(function (p) { return keptPhotos.indexOf(p) < 0; });
        deletePhotos(removed).catch(function () {});
        var keptPaths = keptFiles.map(function (f) { return f.path; });
        deleteFiles((editing.files || []).filter(function (f) { return keptPaths.indexOf(f.path) < 0; })).catch(function () {});
      } else {
        await api('memos', { method: 'POST', body: body, prefer: 'return=minimal' });
      }
      store('memo.draft', null);
      endEdit(true);
      msg.textContent = '저장했습니다.';
      setTimeout(function () { if (msg.textContent === '저장했습니다.') msg.textContent = ''; }, 2500);
      reload();
    } catch (e) {
      deletePhotos(uploaded).catch(function () {});
      deleteFiles(uploadedFiles).catch(function () {});

  }

  // ---------------------------------------------------------------- 내보내기
  $('exportBtn').addEventListener('click', async function () {

      var stamp = C.dayKey(new Date().toISOString()).replace(/-/g, '');
      var root = '나의메모_' + stamp + '/';
      var files = [], photoMap = {}, failed = 0;

        msg.textContent = '사진 받는 중… (' + (i + 1) + '/' + paths.length + ')';

          photoMap[paths[i]] = name;

      var atts = [].concat.apply([], all.map(function (m) { return m.files || []; }));

      var fileMap = {}, fileFailed = 0;
      for (var k = 0; k < atts.length; k++) {

        try {

      var todoRows = [];

  async function toggleTodo(t, done) {

    Object.assign(t, patch); renderTodos();
    try { await api('todos?id=eq.' + t.id, { method: 'PATCH', body: patch, prefer: 'return=minimal' }); todoNote(''); }
    catch (e) { Object.assign(t, prev); renderTodos(); todoNote('저장 실패: ' + e.message, true); }
  }

  async function saveTodo() {
    var title = $('todoTitle').value.trim();
    if (!title) { todoNote('할 일을 입력하세요.', true); return; }
    var body = { title: title, category: todoCat, due_date: $('todoDue').value || null };
    $('todoSaveBtn').disabled = true; todoNote('저장 중…');
    try {
      if (todoEditing) await api('todos?id=eq.' + todoEditing.id, { method: 'PATCH', body: body, prefer: 'return=minimal' });
      else await api('todos', { method: 'POST', body: body, prefer: 'return=minimal' });
      var wasEditing = !!todoEditing;
      endTodoEdit(); todoNote('');
      await loadTodos();
      if (!wasEditing) $('todoTitle').focus();
    } catch (e) {
      todoNote('저장 실패: ' + e.message + ' (입력한 내용은 남아 있습니다)', true);
    } finally { $('todoSaveBtn').disabled = false; }
  }
  $('todoSaveBtn').addEventListener('click', saveTodo);
  $('todoTitle').addEventListener('keydown', function (e) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter') { e.preventDefault(); saveTodo(); }
  });

  function startTodoEdit(t) {
    todoEditing = t; $('todoTitle').value = t.title; $('todoDue').value = t.due_date || ''; todoCat = t.category || null;
    $('todoSaveBtn').textContent = '수정 저장'; $('todoCancelBtn').classList.remove('hidden');
    $('todoComposer').classList.add('editing'); renderTodoChips();
    $('todoComposer').scrollIntoView({ behavior: 'smooth', block: 'start' }); $('todoTitle').focus();
  }
  function endTodoEdit() {
    var was = !!todoEditing;
    todoEditing = null; $('todoTitle').value = ''; $('todoDue').value = ''; if (was) todoCat = null;
    $('todoSaveBtn').textContent = '추가'; $('todoCancelBtn').classList.add('hidden');
    $('todoComposer').classList.remove('editing'); renderTodoChips();
  }
  $('todoCancelBtn').addEventListener('click', function () { todoNote(''); endTodoEdit(); });

  async function deleteTodo(t) {
    if (!confirm('이 할 일을 삭제할까요? 되돌릴 수 없습니다.\n\n' + t.title)) return;
    try {
      await api('todos?id=eq.' + t.id, { method: 'DELETE', prefer: 'return=minimal' });
      if (todoEditing && todoEditing.id === t.id) endTodoEdit();
      todos = todos.filter(function (x) { return x !== t; }); renderTodos();
    } catch (e) { todoNote('삭제 실패: ' + e.message, true); }
  }
  async function clearDone(list) {
    if (!confirm('완료한 할 일 ' + list.length + '개를 모두 지울까요? 되돌릴 수 없습니다.')) return;
    try {
      await api('todos?id=in.(' + list.map(function (t) { return t.id; }).join(',') + ')', { method: 'DELETE', prefer: 'return=minimal' });
      todos = todos.filter(function (t) { return list.indexOf(t) < 0; }); renderTodos();
    } catch (e) { todoNote('삭제 실패: ' + e.message, true); }
  }

  // ---------------------------------------------------------------- 시작
  if (session && session.refresh_token) showApp(); else showLogin();
})();
</script>
